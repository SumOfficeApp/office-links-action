name: self-test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links-open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: links
        uses: ./
        with:
          files: |
            samples/service-agreement.docx
            samples/invoice.xlsx
          from: self-test
      - name: Each link opens a real document in Layers
        shell: bash
        env:
          LINKS: ${{ steps.links.outputs.links }}
        run: |
          node --input-type=module -e '
          const links = JSON.parse(process.env.LINKS);
          if (links.length !== 2) throw new Error("expected 2 links, got " + links.length);
          for (const l of links) {
            const src = new URLSearchParams(new URL(l.url).hash.slice(1)).get("url");
            const r = await fetch("https://app.layers.md/v1/public/viewer/import", { method: "POST", headers: { "Content-Type": "application/json", "User-Agent": "layers-action-self-test LayersQA-bot/1.0" }, body: JSON.stringify({ url: src, from: "self-test" }) });
            const b = await r.json();
            if (!r.ok || !b.openUrl) throw new Error(l.path + ": " + JSON.stringify(b));
            console.log("ok", l.path, b.kind);
          }'
